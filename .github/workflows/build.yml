name: web-shell

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the tag step can create/upload a GitHub Release (the default
# GITHUB_TOKEN is read-only for `contents`).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a preinstalled Android SDK; just ensure
      # the platform + build-tools this project targets are present.
      - name: Ensure Android platform and build-tools
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Same debug signature as local builds: restore the shared debug
      # keystore next to the checkout; webapp/build.gradle.kts reads the
      # DEBUG_KEYSTORE_* env vars for its sharedDebug signingConfig
      # (no ~/.android path guessing).
      - name: Restore shared debug keystore
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > .ci-debug.keystore
          chmod 600 .ci-debug.keystore
          # Self-check: must print 76:0D:C0:5F:B4:D1:A1:25 (public cert fingerprint).
          keytool -list -v -keystore .ci-debug.keystore \
            -storepass "$ANDROID_DEBUG_STORE_PASSWORD" 2>/dev/null | grep -E "Alias name|SHA256" || true

      # The product is the web shell (:webapp). The legacy native shell
      # (:app) is intentionally NOT tested here: dozens of its tests depend
      # on gitignored device-capture fixtures (research/v97_verify/**) that
      # do not exist on a clean checkout and fail by design. Build it locally
      # if you need it.
      - name: Unit tests
        env:
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.ci-debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :webapp:testDebugUnitTest --no-daemon

      - name: Assemble web-shell APKs
        env:
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.ci-debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :webapp:assembleDebug :webapp:assembleRelease :webapp:assembleReleaseR8 --no-daemon

      # Guard: CI APKs must carry the shared cert (760dc05f…); fail loudly
      # on any keystore drift instead of shipping uninstall-required builds.
      - name: Verify APK signatures
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"
          for apk in \
            webapp/build/outputs/apk/debug/webapp-debug.apk \
            webapp/build/outputs/apk/release/webapp-release.apk \
            webapp/build/outputs/apk/releaseR8/webapp-releaseR8.apk; do
            echo "== $apk"
            apksigner verify --print-certs "$apk" | tee /tmp/certs.txt | grep -E "Signer #1|SHA-256"
            grep -q "760dc05fb4d1a125ed82cf9bff8eee622c7244d44b6ddc82a4c34e0b37b820e6" /tmp/certs.txt
          done

      - name: Compute checksums
        run: |
          sha256sum \
            webapp/build/outputs/apk/debug/webapp-debug.apk \
            webapp/build/outputs/apk/release/webapp-release.apk \
            webapp/build/outputs/apk/releaseR8/webapp-releaseR8.apk

      # Distribution is via GitHub Actions run artifacts (every build) and,
      # on tag pushes, a GitHub Release.
      - name: Upload web-shell APKs as Actions artifact
        uses: actions/upload-artifact@v4
        # Artifact storage quota can be hit; do not fail the build — GitHub
        # Releases (below) remain the reliable download path.
        continue-on-error: true
        with:
          name: opencode-web-shell-apks
          path: |
            webapp/build/outputs/apk/debug/webapp-debug.apk
            webapp/build/outputs/apk/release/webapp-release.apk
            webapp/build/outputs/apk/releaseR8/webapp-releaseR8.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webapp/build/outputs/apk/debug/webapp-debug.apk
            webapp/build/outputs/apk/release/webapp-release.apk
            webapp/build/outputs/apk/releaseR8/webapp-releaseR8.apk
          name: OpenCode Web Shell ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
