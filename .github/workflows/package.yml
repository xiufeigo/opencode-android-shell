name: build APK

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The web app loads `assets/www/oc-terminal.js`, a bundle of
      # frontend/terminal/terminal.js. Build it from the lockfile below and
      # prove the committed bundle is in sync, so a source-only change can
      # never ship a stale terminal.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a preinstalled Android SDK; just ensure
      # the platform + build-tools this project targets are present.
      - name: Ensure Android platform and build-tools
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Restore the shared debug keystore next to the checkout;
      # webapp/build.gradle.kts reads DEBUG_KEYSTORE_* env vars for its
      # sharedDebug signingConfig (no ~/.android path guessing).
      #
      # ⚠️ Truth about "the same signature as local": CI signs with the
      # keystore held in the ANDROID_DEBUG_KEYSTORE_BASE64 secret, pinned
      # below by its public cert fingerprint (760dc05f…). A developer
      # machine's ~/.android/debug.keystore is a *different* key unless it
      # was copied from that secret, so locally built APKs and CI APKs do
      # NOT update each other (INSTALL_FAILED_UPDATE_INCOMPATIBLE). To make
      # them interchangeable, set DEBUG_KEYSTORE_PATH to a local copy of the
      # CI keystore before building.
      - name: Restore shared debug keystore
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > .ci-debug.keystore
          chmod 600 .ci-debug.keystore
          # Self-check: must print 76:0D:C0:5F:B4:D1:A1:25 (public cert fingerprint).
          keytool -list -v -keystore .ci-debug.keystore \
            -storepass "$ANDROID_DEBUG_STORE_PASSWORD" 2>/dev/null | grep -E "Alias name|SHA256" || true

      # Locked install (npm ci, never `npm install`) + build of the mobile
      # terminal bundle from source.
      - name: Build embedded UI assets
        working-directory: frontend/terminal
        run: |
          npm ci
          npm test
          npm run build

      - name: Test and build the server browser plugin
        working-directory: plugins/server-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run typecheck
          npm run build

      - name: Build pinned official OpenCode UI
        run: |
          node --test frontend/android/*.test.mjs
          node frontend/android/build.mjs

      # Guard: the committed bundle must be byte-identical to what the source
      # produces. A developer who edits terminal.js but forgets to rebuild
      # ships the old terminal, and the unit tests below would still pass
      # against the stale file.
      - name: Verify committed UI assets match the source
        run: |
          git ls-files --error-unmatch -- webapp/src/main/assets/www/oc-terminal.js
          git diff --exit-code --stat -- webapp/src/main/assets/www/oc-terminal.js
          git diff --exit-code --stat -- webapp/src/main/assets/www/ui
          test -z "$(git ls-files --others --exclude-standard -- webapp/src/main/assets/www/ui)"

      - name: Verify Android Back with packaged phone and tablet UI
        run: node scripts/verify-android-back.mjs

      - name: Build shared Web client and stage plugin distributions
        run: |
          node frontend/android/build.mjs --web
          node scripts/stage-distribution.mjs
          for folder in dist/stage/*; do
            archive="$GITHUB_WORKSPACE/dist/$(basename "$folder").zip"
            (cd "$folder" && zip -rq "$archive" .)
          done

      # The product is the web shell (:webapp). The legacy native shell
      # (:app) is intentionally NOT tested here: dozens of its tests depend
      # on gitignored device-capture fixtures (research/v97_verify/**) that
      # do not exist on a clean checkout and fail by design. Build it locally
      # if you need it.
      - name: Unit tests
        env:
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.ci-debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :webapp:testDebugUnitTest --no-daemon

      # ONE shipping APK variant: release. Every variant carries the
      # same product package id `com.xiufeigo.opencodeshell` (no `.debug`
      # suffix anywhere), which is also what every previous GitHub release
      # shipped — so this APK updates an installed GitHub build in place.
      # debug / releaseR8 are local-only: three APKs with the same
      # applicationId + versionCode can never coexist on a device, so shipping
      # all of them only made the download page ambiguous. A debug APK is built
      # only when the build itself is debug, never here.
      - name: Assemble release APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.ci-debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :webapp:assembleRelease --no-daemon

      # Guard: the shipped APK must be the product identity — package id
      # exactly `com.xiufeigo.opencodeshell` (a `.debug` suffix means the
      # release buildType drifted), and must carry the shared cert
      # (760dc05f…). Fail loudly instead of publishing a wrong-identity file.
      - name: Verify APK identity and signature
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"
          APK=webapp/build/outputs/apk/release/webapp-release.apk
          aapt2 dump badging "$APK" > /tmp/badging.txt
          grep -E "^package:|^application-label:" /tmp/badging.txt | head -3
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" /tmp/badging.txt)
          CODE=$(sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/badging.txt)
          NAME=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" /tmp/badging.txt)
          echo "package=$PKG versionCode=$CODE versionName=$NAME"
          test "$PKG" = "com.xiufeigo.opencodeshell"
          EXPECTED_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' webapp/build.gradle.kts)
          EXPECTED_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' webapp/build.gradle.kts)
          test "$CODE" = "$EXPECTED_CODE"
          test "$NAME" = "$EXPECTED_NAME"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$NAME"
          fi
          apksigner verify --print-certs "$APK" | tee /tmp/certs.txt | grep -E "Signer #1|SHA-256"
          grep -q "760dc05fb4d1a125ed82cf9bff8eee622c7244d44b6ddc82a4c34e0b37b820e6" /tmp/certs.txt
          echo "APK_NAME=opencode-${NAME}.apk" >> "$GITHUB_ENV"

      - name: Stage distribution APK and checksum
        run: |
          mkdir -p dist
          cp webapp/build/outputs/apk/release/webapp-release.apk "dist/${APK_NAME}"
          (cd dist && sha256sum *.apk *.zip | tee SHA256SUMS)

      # Release is the distribution store. Avoid duplicating the same packages
      # in Actions storage, whose quota can block an otherwise verified release.
      - name: Publish APK, server plugin and Web client to GitHub Release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS
          name: OpenCode ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
